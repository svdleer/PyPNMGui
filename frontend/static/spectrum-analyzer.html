<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spectrum Analyzer — Pro Return Path UI</title>
<style>
  :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
  body{margin:0;background:#0b1020;color:#dfe7ff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:6px 12px;background:#071028;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  header h1{font-size:14px;margin:0}
  #controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button, select, input{background:#0f1724;border:1px solid #1f2a44;color:#dfe7ff;padding:6px 8px;border-radius:6px}
  main{flex:1;display:flex;flex-direction:column;padding:4px;overflow:hidden;min-height:0}
  #canvasWrap{flex:1;position:relative;display:flex;flex-direction:column;gap:4px;min-height:0}
  canvas{width:100%;display:block;border-radius:4px;background:#071028}
  #specCanvas{flex:55;min-height:0}
  #waterfallCanvas{flex:45;min-height:0}
  #status{position:absolute;left:10px;top:10px;background:rgba(7,16,40,0.6);padding:6px 8px;border-radius:6px;font-size:12px}
  #cursor{position:absolute;right:10px;top:10px;background:rgba(7,16,40,0.6);padding:6px 8px;border-radius:6px;font-size:12px;text-align:right;white-space:pre}
  footer{padding:4px 8px;background:#071028;font-size:12px;color:#9fb0ff}
  .small{font-size:11px;color:#9fb0ff}
  /* Hide bottom controls when embedded in iframe */
  body.embedded .bottom-controls{display:none}
  body.embedded footer{display:none}
  #jsonIn{width:320px;height:90px}

  /* Buffering overlay */
  #bufferOverlay{
    position:fixed;inset:0;z-index:1000;background:rgba(7,16,40,0.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity 0.5s;
  }
  #bufferOverlay.hidden{opacity:0;pointer-events:none;display:none}
  #bufferOverlay h2{font-size:18px;margin:0 0 6px;color:#7eb8ff}
  #bufferOverlay .subtitle{font-size:13px;color:#8a9cc0;margin-bottom:20px}
  .progress-track{
    width:340px;height:8px;background:#0f1724;border-radius:4px;overflow:hidden;margin-bottom:14px;
  }
  .progress-fill{
    height:100%;border-radius:4px;transition:width 0.4s ease;background:linear-gradient(90deg,#1a5cff,#40b0ff);
  }
  .progress-fill.indeterminate{
    width:30%!important;animation:indeterminate 1.4s ease-in-out infinite;
  }
  @keyframes indeterminate{
    0%{transform:translateX(-100%)}
    50%{transform:translateX(240%)}
    100%{transform:translateX(-100%)}
  }
  .buffer-stats{
    display:flex;gap:20px;font-size:12px;color:#6b80b0;
  }
  .buffer-stats span{display:flex;align-items:center;gap:4px}
  .buffer-stats .val{color:#9fb8e8;font-weight:600}
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#40b0ff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}

  /* Runtime bar in footer */
  #runtimeBar{display:flex;align-items:center;gap:10px;font-size:12px;color:#8a9cc0}
  #runtimeBar .rt-label{color:#6b80b0}
  #runtimeBar .rt-val{color:#9fb8e8;font-weight:600}
  .runtime-track{width:120px;height:4px;background:#0f1724;border-radius:2px;overflow:hidden}
  .runtime-fill{height:100%;border-radius:2px;background:#40b0ff;transition:width 0.3s}
</style>
</head>
<body>
<header>
  <h1>Return Path Spectrum Analyzer (PNM)</h1>
  <div id="controls">
    <button id="resetMax">Reset Max</button>
    <button id="clearWf">Clear WF</button>
    <button id="pauseBtn">Pause</button>

    <label class="small">Scale:
      <select id="scalePreset">
        <option value="auto">Auto</option>
        <option value="-60,0">Return Path (‑60..0)</option>
        <option value="-70,-20">High Sens (‑70..‑20)</option>
      </select>
    </label>

    <label class="small">Hold:
      <select id="holdMode">
        <option value="max">Max Hold</option>
        <option value="decay">Decay</option>
      </select>
    </label>

    <button id="freezeA">Freeze A</button>
    <button id="freezeB">Freeze B</button>
    <label class="small"><input id="showFreeze" type="checkbox" checked /> Show A/B</label>

    <label class="small">Impulse:
      <input id="impulse" type="checkbox" checked />
    </label>

    <label class="small">Zoom:
      <button id="zoomOut">Reset</button>
    </label>
  </div>
</header>
<!-- Buffering overlay -->
<div id="bufferOverlay">
  <h2 id="bufTitle">Preparing Spectrum Analyzer</h2>
  <div class="subtitle" id="bufSubtitle">Configuring UTSC and building initial capture buffer...</div>
  <div class="progress-track"><div class="progress-fill indeterminate" id="bufBar" style="width:30%"></div></div>
  <div class="buffer-stats">
    <span><span class="pulse"></span> <span id="bufSamples">0</span> <span class="rt-label">samples</span></span>
    <span><span class="rt-label">wait</span> <span class="val" id="bufWait">30</span><span class="rt-label">s</span></span>
    <span><span class="rt-label">triggers</span> <span class="val" id="bufTriggers">0</span></span>
  </div>
</div>

<main>
  <div id="canvasWrap">
    <canvas id="specCanvas"></canvas>
    <canvas id="waterfallCanvas"></canvas>
    <div id="status">Status: idle</div>
    <div id="cursor">—</div>
  </div>
  <!-- Debug controls hidden in embedded mode -->
  <div class="bottom-controls" style="display:none">
    <textarea id="jsonIn"></textarea>
    <input id="wsInput" value="" />
    <input type="text" id="targetMac" />
  </div>
</main>
<footer style="display:flex;justify-content:space-between;align-items:center">
  <span id="info">Bins: 0</span>
  <div id="runtimeBar" style="display:none">
    <span class="rt-label">Buffer:</span> <span class="rt-val" id="rtBuffer">0</span>
    <span class="rt-label">Triggers:</span> <span class="rt-val" id="rtTriggers">0</span>
    <span class="rt-label">Runtime:</span> <span class="rt-val" id="rtElapsed">0</span><span class="rt-label">/</span><span class="rt-val" id="rtTotal">60</span><span class="rt-label">s</span>
    <div class="runtime-track"><div class="runtime-fill" id="rtFill" style="width:0%"></div></div>
  </div>
</footer>

<script>
// Detect iframe embedding and add class to hide controls
if (window.self !== window.top) {
  document.body.classList.add('embedded');
}

// Parse URL query parameters
const urlParams = new URLSearchParams(window.location.search);
const paramMac = urlParams.get('mac') || '';
const paramRfPort = urlParams.get('rfport') || '';
const paramCmts = urlParams.get('cmts') || '';
const paramCenterFreq = parseInt(urlParams.get('center_freq_hz')) || 50000000;
const paramSpan = parseInt(urlParams.get('span_hz')) || 60000000;
const paramNumBins = parseInt(urlParams.get('num_bins')) || 800;
const paramOutputFormat = parseInt(urlParams.get('output_format')) || 5;
const paramWindow = parseInt(urlParams.get('window')) || 4;
const paramRuntime = parseInt(urlParams.get('runtime')) || 60;
const paramLive = urlParams.get('live') || '';
const paramCommunity = urlParams.get('community') || '';

// Connect WebSocket via GUI (/ws/utsc/<mac>) — same host as the page
const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsHost = window.location.host;  // includes port (e.g. 127.0.0.1:5050)

// Update URL when inputs change
function updateWsUrl() {
    const mac = document.getElementById('targetMac').value.trim().replace(/:/g, '').toLowerCase();
    const qs = new URLSearchParams({
        rf_port: paramRfPort || '',
        cmts_ip: paramCmts || '',
        community: paramCommunity || 'private',
        refresh: '500',
        duration: String(paramRuntime || 60)
    });
    // WS uses top-level /ws/ path (separate Apache Location block)
    document.getElementById('wsInput').value = `${wsProtocol}//${wsHost}/ws/utsc/${mac}?${qs}`;
}

// Initialize with query param values
document.getElementById('targetMac').value = paramMac;
document.getElementById('targetMac').addEventListener('input', updateWsUrl);
updateWsUrl();

// ===== State (must be before resize/draw calls) =====
let bins = [];
let freqStart = 0;
let freqStep  = 1;
let maxHold   = [];
let freezeA   = null;
let freezeB   = null;
let paused    = false;
let holdMode  = 'max';
let decayRate = 0.992;
let scaleMode = 'auto';
let impulseOn = true;

// zoom window
let viewStart = 0;
let viewEnd   = null; // null = full

// Waterfall
let wfRows = 240;
let wfBuffer = [];

const statusEl = document.getElementById('status');
const cursorEl = document.getElementById('cursor');
const infoEl   = document.getElementById('info');

// ===== Canvas setup =====
const specCanvas = document.getElementById('specCanvas');
const wfCanvas   = document.getElementById('waterfallCanvas');
const sctx = specCanvas.getContext('2d');
const wctx = wfCanvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
function resize(){
  for(const c of [specCanvas,wfCanvas]){
    const r = c.getBoundingClientRect();
    c.width  = Math.round(r.width  * dpr);
    c.height = Math.round(r.height * dpr);
    c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  }
  if(bins.length > 0) { draw(); drawWaterfall(); }
}
window.addEventListener('resize', resize);
resize();

function setStatus(s){ statusEl.textContent = 'Status: ' + s; }

// ===== Incoming data =====
// Buffering overlay elements
const bufOverlay  = document.getElementById('bufferOverlay');
const bufTitle    = document.getElementById('bufTitle');
const bufSubtitle = document.getElementById('bufSubtitle');
const bufBar      = document.getElementById('bufBar');
const bufSamples  = document.getElementById('bufSamples');
const bufWait     = document.getElementById('bufWait');
const bufTriggers = document.getElementById('bufTriggers');
const runtimeBar  = document.getElementById('runtimeBar');
let bufferingDone = false;

function hideBufferOverlay() {
  if (!bufferingDone) {
    bufferingDone = true;
    bufOverlay.classList.add('hidden');
    runtimeBar.style.display = 'flex';
    // Notify parent window (modal) that buffering is done
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'buffering_complete' }, '*');
    }
  }
}

function handleMessage(msg){
  // Handle wrapped format from WebSocket server
  if(msg && msg.type === 'spectrum' && msg.raw_data) {
    msg = msg.raw_data;
  }

  // === Buffering phase messages ===
  if(msg && msg.type === 'buffering') {
    bufTitle.textContent = `Loading... ${msg.buffer_size || 0} sample${(msg.buffer_size==1)?'':'s'} loaded`;
    bufSubtitle.textContent = msg.message || 'Collecting samples...';
    bufSamples.textContent = msg.buffer_size || 0;
    if (msg.wait_remaining_s !== undefined) bufWait.textContent = Math.round(msg.wait_remaining_s);
    if (msg.target) {
      const pct = Math.min(100, ((msg.buffer_size || 0) / msg.target) * 100);
      bufBar.classList.remove('indeterminate');
      bufBar.style.width = pct + '%';
    }
    setStatus(msg.message || `Loading... ${msg.buffer_size || 0} samples loaded`);
    return;
  }
  if(msg && msg.type === 'buffering_complete') {
    hideBufferOverlay();
    setStatus('Streaming');
    return;
  }
  if(msg && msg.type === 'connected') {
    bufTitle.textContent = 'Connecting to CMTS';
    bufSubtitle.textContent = msg.message || 'Configuring UTSC...';
    bufBar.classList.add('indeterminate');
    setStatus(msg.message || 'Connected');
    return;
  }
  if(msg && msg.type === 'complete') {
    setStatus('Complete — ' + (msg.message || ''));
    return;
  }
  // Handle other message types (heartbeat, etc.)
  if(msg && msg.type === 'heartbeat') {
    // Update runtime bar from heartbeat
    if (msg.triggers !== undefined) document.getElementById('rtTriggers').textContent = msg.triggers;
    if (msg.buffer_size !== undefined) document.getElementById('rtBuffer').textContent = msg.buffer_size;
    if (msg.runtime_elapsed_s !== undefined) {
      document.getElementById('rtElapsed').textContent = Math.round(msg.runtime_elapsed_s);
    }
    return;
  }
  if(msg && msg.type && msg.type !== 'spectrum') {
    setStatus(msg.message || msg.type);
    return;
  }
  
  if(!msg || !Array.isArray(msg.bins)) return;

  // First data frame — ensure overlay is gone
  if (!bufferingDone) hideBufferOverlay();
  // Always notify parent on data frames (in case it missed buffering_complete)
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'spectrum_data' }, '*');
  }
  bins = msg.bins.slice();
  freqStart = msg.freq_start_hz || freqStart;
  freqStep  = msg.freq_step_hz  || freqStep;

  if(viewEnd === null){ viewStart = 0; viewEnd = bins.length-1; }

  if(maxHold.length !== bins.length) maxHold = bins.slice();

  if(holdMode === 'max'){
    for(let i=0;i<bins.length;i++) if(bins[i] > maxHold[i]) maxHold[i] = bins[i];
  } else {
    for(let i=0;i<bins.length;i++){
      if(bins[i] > maxHold[i]) maxHold[i] = bins[i];
      else maxHold[i] = maxHold[i]*decayRate + bins[i]*(1-decayRate);
    }
  }

  wfBuffer.unshift(bins.slice());
  if(wfBuffer.length > wfRows) wfBuffer.pop();

  // Update footer info + runtime bar
  infoEl.textContent = `Bins: ${bins.length} | WF: ${wfBuffer.length}/${wfRows} | ${(freqStart/1e6).toFixed(2)} → ${((freqStart+freqStep*(bins.length-1))/1e6).toFixed(2)} MHz`;
  if (msg.buffer_size !== undefined) document.getElementById('rtBuffer').textContent = msg.buffer_size;
  if (msg.triggers !== undefined) document.getElementById('rtTriggers').textContent = msg.triggers;
  if (msg.runtime_elapsed_s !== undefined) {
    const el = msg.runtime_elapsed_s;
    const tot = msg.runtime_total_s || paramRuntime;
    document.getElementById('rtElapsed').textContent = Math.round(el);
    document.getElementById('rtTotal').textContent = tot;
    const pct = Math.min(100, (el / tot) * 100);
    document.getElementById('rtFill').style.width = pct + '%';
  }
  draw(); drawWaterfall();
}

// ===== Drawing =====
function drawGrid(ctx,w,h){
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.06)';
  for(let i=0;i<=6;i++){ const y=(h/6)*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  ctx.restore();
}

function draw(){
  const w = specCanvas.width / dpr;
  const h = specCanvas.height / dpr;
  const plotLeft = 65;      // space for Y axis labels
  const plotBottom = 36;   // space for X axis labels
  const plotTop = 10;
  const plotRight = 10;

  sctx.clearRect(0,0,w,h);
  sctx.fillStyle='#071028'; sctx.fillRect(0,0,w,h);
  drawGrid(sctx,w,h);
  if(!bins.length) return;

  const lo = viewStart, hi = viewEnd;
  const plotW = w - plotLeft - plotRight;
  const plotH = h - plotTop - plotBottom;
  const slice = bins.slice(lo,hi+1);
  const sliceHold = maxHold.slice(lo,hi+1);

  let minV=Infinity, maxV=-Infinity;
  for(let v of slice.concat(sliceHold, freezeA||[], freezeB||[])){
    if(isFinite(v)){ if(v<minV) minV=v; if(v>maxV) maxV=v; }
  }

  if(scaleMode !== 'auto'){
    const p = scaleMode.split(','); minV=parseFloat(p[0]); maxV=parseFloat(p[1]);
  } else {
    const pad=(maxV-minV)*0.08||1; maxV+=pad; minV-=pad;
  }

  const valToY = v => (plotTop + plotH) - ((v-minV)/(maxV-minV))*(plotH);
  const pxStep = plotW / (slice.length-1);

  // draw axes
  sctx.strokeStyle='rgba(200,200,255,0.4)'; sctx.lineWidth=1;
  // Y axis
  sctx.beginPath(); sctx.moveTo(plotLeft,plotTop); sctx.lineTo(plotLeft,plotTop+plotH); sctx.stroke();
  // X axis
  sctx.beginPath(); sctx.moveTo(plotLeft,plotTop+plotH); sctx.lineTo(plotLeft+plotW,plotTop+plotH); sctx.stroke();

  // Y ticks + labels
  sctx.fillStyle='rgba(200,200,255,0.8)'; sctx.font='11px system-ui';
  sctx.textAlign='right';
  for(let i=0;i<=5;i++){
    const v=minV+(maxV-minV)*(i/5);
    const y=valToY(v);
    sctx.beginPath(); sctx.moveTo(plotLeft-5,y); sctx.lineTo(plotLeft,y); sctx.stroke();
    sctx.fillText(v.toFixed(1), plotLeft-8, y+4);
  }
  sctx.textAlign='start';

  // X ticks + labels
  sctx.font='11px system-ui';
  sctx.textAlign='center';
  const xTicks=6;
  for(let i=0;i<=xTicks;i++){
    const idx=Math.floor(lo+(hi-lo)*(i/xTicks));
    const x=plotLeft + (idx-lo)/(hi-lo)*plotW;
    const f=(freqStart+idx*freqStep)/1e6;
    sctx.beginPath(); sctx.moveTo(x,plotTop+plotH); sctx.lineTo(x,plotTop+plotH+5); sctx.stroke();
    sctx.fillText(f.toFixed(1), x, plotTop+plotH+18);
  }
  sctx.textAlign='start';

  // live trace
  sctx.beginPath(); sctx.strokeStyle='rgba(140,200,255,0.95)'; sctx.lineWidth=1.4;
  for(let i=0;i<slice.length;i++){ const x=plotLeft + i*pxStep,y=valToY(slice[i]); i? sctx.lineTo(x,y):sctx.moveTo(x,y); }
  sctx.stroke();

  // max hold
  sctx.beginPath(); sctx.setLineDash([6,4]); sctx.strokeStyle='rgba(255,200,120,0.95)';
  for(let i=0;i<sliceHold.length;i++){ const x=plotLeft + i*pxStep,y=valToY(sliceHold[i]); i? sctx.lineTo(x,y):sctx.moveTo(x,y); }
  sctx.stroke(); sctx.setLineDash([]);

  // freeze overlays
  if(document.getElementById('showFreeze').checked){
    if(freezeA){ sctx.beginPath(); sctx.strokeStyle='rgba(0,255,160,0.9)'; for(let i=lo;i<=hi;i++){ const x=plotLeft + (i-lo)*pxStep,y=valToY(freezeA[i]); i===lo? sctx.moveTo(x,y):sctx.lineTo(x,y);} sctx.stroke(); }
    if(freezeB){ sctx.beginPath(); sctx.strokeStyle='rgba(255,100,180,0.9)'; for(let i=lo;i<=hi;i++){ const x=plotLeft + (i-lo)*pxStep,y=valToY(freezeB[i]); i===lo? sctx.moveTo(x,y):sctx.lineTo(x,y);} sctx.stroke(); }
  }

  // impulse detector
  if(impulseOn){
    for(let i=1;i<slice.length-1;i++){
      const v=slice[i];
      const avg=(slice[i-1]+slice[i+1])/2;
      if(v-avg > 6){ // >6 dB spike
        const x=plotLeft + i*pxStep, y=valToY(v);
        sctx.fillStyle='red'; sctx.beginPath(); sctx.arc(x,y,3,0,Math.PI*2); sctx.fill();
      }
    }
  }
}

// ===== Waterfall =====
function colorMap(v,minV,maxV){
  const t=Math.max(0,Math.min(1,(v-minV)/(maxV-minV)));
  const r=Math.floor(255*Math.min(1,Math.max(0,(t-0.5)*2)));
  const g=Math.floor(255*Math.min(1,Math.max(0,1-Math.abs(t-0.5)*2)));
  const b=Math.floor(255*Math.min(1,Math.max(0,(0.5-t)*2)));
  return `rgb(${r},${g},${b})`;
}

function drawWaterfall(){
  const w = wfCanvas.width / dpr;
  const h = wfCanvas.height / dpr;
  wctx.clearRect(0,0,w,h);
  if(!wfBuffer.length) return;

  let minV=Infinity,maxV=-Infinity;
  for(let v of bins){ if(v<minV)minV=v; if(v>maxV)maxV=v; }
  const pad=(maxV-minV)*0.1||1; maxV+=pad; minV-=pad;

  const rowH=h/wfRows; const pxStep=w/(bins.length-1);
  for(let r=0;r<wfBuffer.length;r++){
    const row=wfBuffer[r]; const y=r*rowH;
    for(let i=0;i<row.length;i++){
      wctx.fillStyle=colorMap(row[i],minV,maxV);
      wctx.fillRect(i*pxStep,y,pxStep+1,rowH+1);
    }
  }
}

// ===== Cursor + Zoom =====
specCanvas.addEventListener('mousemove', e=>{
  if(!bins.length) return;
  const rect=specCanvas.getBoundingClientRect();
  const x=(e.clientX-rect.left);
  const idx=Math.round(viewStart + x/rect.width * (viewEnd-viewStart));
  const f=(freqStart+idx*freqStep)/1e6;
  const v=bins[idx];
  cursorEl.textContent=`${f.toFixed(3)} MHz\n${v.toFixed(2)} dBmV/MHz\nBin ${idx}`;
});

// mouse wheel zoom
specCanvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const span=viewEnd-viewStart;
  const center=viewStart+span/2;
  const factor=e.deltaY>0?1.2:0.8;
  let newSpan=Math.max(50,Math.min(bins.length,span*factor));
  viewStart=Math.max(0,Math.floor(center-newSpan/2));
  viewEnd=Math.min(bins.length-1,Math.floor(center+newSpan/2));
  draw();
});

document.getElementById('zoomOut').onclick=()=>{ viewStart=0; viewEnd=bins.length-1; draw(); };

// ===== Controls =====
document.getElementById('resetMax').onclick=()=>{ maxHold=bins.slice(); draw(); };
document.getElementById('clearWf').onclick =()=>{ wfBuffer=[]; drawWaterfall(); };
document.getElementById('pauseBtn').onclick =e=>{ paused=!paused; e.target.textContent=paused?'Resume':'Pause'; };
document.getElementById('scalePreset').onchange=e=>{ scaleMode=e.target.value; draw(); };
document.getElementById('holdMode').onchange=e=>{ holdMode=e.target.value; };
document.getElementById('impulse').onchange=e=>{ impulseOn=e.target.checked; draw(); };
document.getElementById('freezeA').onclick=()=>{ freezeA=bins.slice(); };
document.getElementById('freezeB').onclick=()=>{ freezeB=bins.slice(); };

// ===== WebSocket =====
let ws=null;

function connectWebSocket() {
  const url=wsInput.value.trim();
  if (!url) {
    setStatus('No WebSocket URL');
    return;
  }
  
  // Get config values
  const mac = document.getElementById('targetMac').value.trim();
  const cmtsIp = paramCmts || '';
  const rfPort = parseInt(paramRfPort) || 0;
  const skipConfigure = paramLive === '1';  // Skip reconfigure when UTSC already running (live=1)
  
  ws=new WebSocket(url);
  ws.onopen =()=>{
    setStatus('ws connected — sending config...');
    ws.send(JSON.stringify({
      cmts_ip: cmtsIp,
      rf_port_ifindex: rfPort,
      community: paramCommunity || 'private',
      mac_address: mac,
      interval_ms: 500,
      skip_configure: skipConfigure,
      center_freq_hz: paramCenterFreq,
      span_hz: paramSpan,
      num_bins: paramNumBins,
      output_format: paramOutputFormat,
      window: paramWindow,
      runtime: paramRuntime
    }));
    setStatus('ws streaming');
  };
  ws.onclose=()=>{ setStatus('ws closed'); ws = null; };
  ws.onerror=()=>{ setStatus('ws error'); };
  ws.onmessage=evt=>{ 
    if(paused) return; 
    try { handleMessage(JSON.parse(evt.data)); } catch(e) {} 
  };
}

// Auto-connect if MAC and CMTS were provided via URL parameters
if (paramMac && paramCmts && paramRfPort) {
  setTimeout(connectWebSocket, 500);
}

// Stop UTSC when window/tab closes
window.addEventListener('beforeunload', () => {
  if (ws) {
    // Send stop command to PyPNM API
    const stopUrl = `/api/pypnm/upstream/utsc/stop/${paramMac}`;
    const data = JSON.stringify({
      cmts_ip: paramCmts,
      rf_port_ifindex: parseInt(paramRfPort),
      community: paramCommunity || 'private'
    });
    // Use sendBeacon for reliable delivery on page unload
    navigator.sendBeacon(stopUrl, new Blob([data], {type: 'application/json'}));
  }
});

setStatus(paramMac ? 'auto-connecting...' : 'idle');
</script>
</body>
