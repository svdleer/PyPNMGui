<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyPNM Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 20%, #1f6feb 0%, #0f3d8a 38%, #0b1f42 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        }
        .login-card {
            width: min(420px, 94vw);
            border: 0;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="card-body p-4 p-md-5">
            <h3 class="mb-1"><i class="bi bi-router me-2"></i>PyPNM</h3>
            <p class="text-muted mb-4">Sign in to continue</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-[[ 'danger' if category == 'danger' else 'success' ]] py-2">[[ message ]]</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="post" action="[[ base_path ]]/login">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input name="username" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
