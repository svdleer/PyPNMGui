<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Unavailable — PyPNM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 520px;
            padding: 2rem;
        }
        .icon {
            font-size: 4.5rem;
            color: #444;
            display: block;
            margin-bottom: 1.5rem;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50%       { opacity: 0.9; }
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 0.75rem;
        }
        p {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .admin-link {
            font-size: 0.78rem;
            color: #333;
            text-decoration: none;
            border: 1px solid #222;
            padding: 0.4rem 0.9rem;
            border-radius: 4px;
            transition: color 0.2s, border-color 0.2s;
        }
        .admin-link:hover {
            color: #666;
            border-color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <i class="bi bi-router icon"></i>
        <h1>Site Temporarily Closed</h1>
        <p>[[ message or 'This service is temporarily unavailable. Please try again later.' ]]</p>
        <a href="[[ base_path ]]/login" class="admin-link"><i class="bi bi-lock me-1"></i>Admin access</a>
    </div>
</body>
</html>
