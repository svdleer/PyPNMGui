<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PyPNM Web GUI - Cable Modem PNM Tool{% endblock %}</title>
    
    <!-- Base path configuration for frontend -->
    <script>
        window.BASE_PATH = '[[ base_path ]]' || '';
    </script>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="[[ asset_url('css/style.css') ]]" rel="stylesheet">
    {% if brand_enabled %}
    <link href="[[ asset_url('css/brand-skin.css') ]]" rel="stylesheet">
    {% endif %}
    
    <style>
        :root {
            --app-footer-height: 32px;
            --app-footer-buffer: 16px;
        }

        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(var(--app-footer-height) + var(--app-footer-buffer) + env(safe-area-inset-bottom));
        }
        
        main {
            flex: 1;
            overflow-y: auto;
            padding-top: 1rem;
            padding-bottom: 0;
        }
        
        footer {
            margin-top: auto;
        }
        
        /* Navbar styling */
        .navbar-compact {
            padding-top: 0.25rem !important;
            padding-bottom: 0.25rem !important;
        }
        
        .navbar-logo {
            max-height: 32px;
            width: auto;
        }

        /* Shared sticky footer must always win over page-level styles */
        #app-footer {
            position: fixed !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 2000 !important;
            height: var(--app-footer-height) !important;
            border-top: var(--app-footer-border, 1px solid #dee2e6) !important;
            background: var(--app-footer-background, #f8fafc) !important;
            color: var(--app-footer-color, inherit) !important;
            display: flex !important;
            align-items: center !important;
            box-shadow: var(--app-footer-shadow, 0 -1px 4px rgba(0, 0, 0, 0.05)) !important;
        }

        /* Extra render buffer so cards/buttons never sit on the footer edge */
        main::after {
            content: "";
            display: block;
            height: var(--app-footer-buffer);
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="pypnm-app-shell{% if brand_enabled %} pypnm-brand-skin{% endif %}" data-ui-skin="[[ ui_skin ]]">
    <!-- Sticky Header -->
    {% include 'header.html' %}
    
    <!-- Main Content -->
    <main class="pypnm-app-main" style="flex: 1; overflow-y: auto;">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Sticky Footer -->
    {% include 'footer.html' %}
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
