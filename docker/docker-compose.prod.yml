  pypnm-data-prod:
    driver: local
  pypnm-logs-prod:
    driver: local
  redis-data-prod:
    driver: local
  # Uncomment if running agent in Docker
  # agent-config-prod:
  #   driver: local
  # agent-logs-prod:
  #   driver: local
