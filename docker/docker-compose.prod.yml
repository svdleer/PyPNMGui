version: '3.8'

services:
  # PyPNM API - Built from fork at ${PYPNM_SRC:-/opt/pypnm}
  pypnm-api:
    build:
      context: ${PYPNM_SRC:-/opt/pypnm}
      dockerfile: Dockerfile
      args:
        # NOTE: https_proxy must use http:// scheme — the proxy speaks plain HTTP.
        # Hardcoded here to prevent the host OS https_proxy=https://... from overriding.
        http_proxy: ${PYPNM_BUILD_PROXY:-http://proxy.ext.oss.local:8080}
        https_proxy: ${PYPNM_BUILD_PROXY:-http://proxy.ext.oss.local:8080}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,.oss.local}
    image: pypnm:latest
    container_name: pypnm-api-prod
    network_mode: host
    env_file:
      - .env.pypnm
    environment:
      # Timezone - sync with host
      - TZ=Europe/Amsterdam
      # Pysnmp MIB configuration - Include pysnmp-mibs package directory
      - PYSNMP_MIB_DIRS=/usr/local/lib/python3.12/dist-packages/pysnmp_mibs
      # Agent authentication token
      - PYPNM_AGENT_TOKEN=${AGENT_AUTH_TOKEN:-dev-token-change-me}
      # Enable agent-based SNMP routing
      - PYPNM_USE_AGENT_SNMP=true
      # PNM file retrieval method is set in .env.pypnm (PNM_FILE_SOURCE=ftp)
      # Vendor-specific TFTP IPs and upload roots — all sourced from env_file (.env.pypnm).
      # Each falls back to TFTP_IPV4_ALT, then TFTP_IPV4 if not set.
      # Clear proxy env vars baked into image at build time — prevents wget/curl
      # inside the container from routing localhost healthchecks through the proxy
      - http_proxy=
      - https_proxy=
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - no_proxy=localhost,127.0.0.1,.oss.local
      - NO_PROXY=localhost,127.0.0.1,.oss.local
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/tftpboot:/var/lib/tftpboot:ro
      # Topology dataset volume (NL_topology_YYYYMMDD + NL_modemlocation_YYYYMMDD)
      - ${TOPOLOGY_VOLUME_HOST:-/app/topology}:/app/data/topology:ro
      # Share data volume with GUI so FTP-prefetched RxMER files in
      # /app/data/pnm_cache are visible to PyPNM fiberNode plot/analyze.
      - pypnm-data-prod:/app/data
      # Mount source code for live updates without rebuild
      - ${PYPNM_SRC:-/opt/pypnm}/src/pypnm:/app/pypnm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15

  # GUI Server - Production Version with ISW API
  gui-server-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        CACHEBUST: ${CACHEBUST:-1}
        # NOTE: https_proxy must use http:// scheme — the proxy speaks plain HTTP.
        # Hardcoded here to prevent the host OS https_proxy=https://... from overriding.
        http_proxy: ${PYPNM_BUILD_PROXY:-http://proxy.ext.oss.local:8080}
        https_proxy: ${PYPNM_BUILD_PROXY:-http://proxy.ext.oss.local:8080}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,.oss.local}
    container_name: pypnm-gui-prod
    image: docker_gui-server-prod:latest
    network_mode: host
    env_file:
      - .env.pypnm
    environment:
      - TZ=Europe/Amsterdam
      - FLASK_ENV=production
      - PYPNM_MODE=production
      - PYPNM_BASE_URL=${PYPNM_BASE_URL:-http://localhost:8000}
      # Redis is optional - uncomment if you have Redis running
      # - REDIS_HOST=localhost
      # - REDIS_PORT=6379
      # Application root for transparent proxy support (e.g., /cmtool)
      - APPLICATION_ROOT=/cmtool
      # Agent WebSocket support (for future agent connections if needed)
      - ENABLE_AGENT_WEBSOCKET=true
      - DATA_MODE=agent
      # ISW API Configuration for device list
      - APPDB_API_URL=${APPDB_API_URL:-https://appdb.oss.local/isw/api}
      - APPDB_API_USER=${APPDB_API_USER:-isw}
      - APPDB_API_PASS=${APPDB_API_PASS:-Spyem_OtGheb4}
      # Proxy bypass for internal services
      - NO_PROXY=localhost,127.0.0.1,appdb.oss.local,.oss.local
      - no_proxy=localhost,127.0.0.1,appdb.oss.local,.oss.local
      # Vendor-specific TFTP IPs and upload roots — all sourced from env_file (.env.pypnm).
      # Each falls back to TFTP_IPV4_ALT, then TFTP_IPV4 if not set.
      # SNMP Communities
      # NOTE: CMTS_COMMUNITY, CMTS_SNMP_COMMUNITY, MODEM_COMMUNITY, CM_SNMP_COMMUNITY,
      # and CMTS_WRITE_COMMUNITY are all sourced from env_file (.env.pypnm) to avoid
      # overriding with the host shell defaults when those vars are not exported.
      # PNM file retrieval — set in .env.pypnm; listed here for documentation only.
      # PNM_FILE_SOURCE   local (default) | ftp  — use ftp when no TFTP mount
      # FTP_SERVER_IP     FTP server (defaults to TFTP_IPV4 if blank)
      # FTP_PORT          21
      # FTP_USER          ftpaccess
      # FTP_PASSWORD      ftpaccessftp
      # FTP_TFTPBOOT_DIR  /access/pnmupload  (must match TFTP_DEST_PATH on modem trigger)
      # PNM_CACHE_DIR     /app/data/pnm_cache
    volumes:
      - pypnm-data-prod:/app/data
      - pypnm-logs-prod:/app/logs
      - /var/lib/tftpboot:/var/lib/tftpboot:ro
      # Mount source code for live updates without rebuild
      - ../backend/app:/app/app:ro
      - ../frontend:/app/frontend:ro
    restart: unless-stopped
    depends_on:
      - pypnm-api
    #  - redis-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

