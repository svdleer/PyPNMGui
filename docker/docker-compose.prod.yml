  #     - PYPNM_AGENT_TOKEN=${AGENT_AUTH_TOKEN:-dev-token-change-me}
  #     - PYPNM_CM_COMMUNITY=${MODEM_COMMUNITY:-private}
  #     - TFTP_IPV4=${TFTP_IPV4:-172.16.6.101}
  #     - TFTP_IPV4_ALT=${TFTP_IPV4_ALT:-172.22.147.18}
